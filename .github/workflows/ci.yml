name: OpenAI4S cloud closeout preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare PR ${{ matrix.pr }} in the cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pr: 215
            original: 02ead366396d5c39cca1447fb811570f2c1136e7
          - pr: 216
            original: 819289264cf729340ce67f18f3f21e8d4ea1022f
    env:
      UPSTREAM: e9f1c284ef5d73454b060847c67ec2f49015ac50
      ORIGINAL: ${{ matrix.original }}
      PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.original }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Merge the pinned upstream; stop on any source conflict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          git config user.name dvd233
          git config user.email 111864431+dvd233@users.noreply.github.com
          git fetch --no-tags https://github.com/PKU-YuanGroup/OpenAI4S.git "$UPSTREAM"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM"
          git merge --no-ff --no-commit "$UPSTREAM" || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U', '-z']).decode().split('\0')
          paths = [p for p in paths if p]
          print('Actual conflicts:', paths)
          assert all(p.startswith('openai4s/server/webui/dist/') for p in paths), paths
          PY
          # Generated output is replaced only by the official build below.
          git restore --source=HEAD --staged --worktree -- openai4s/server/webui/dist
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Verify the original source and regression cases are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          files = ['docs/plan-crosswalk.json', 'tests/browser_smoke.mjs']
          if os.environ['PR'] == '215':
              files += ['frontend/src/features/sessions/compute.ts', 'frontend/src/features/sessions/compute.test.ts', 'frontend/src/stores/timeline.ts']
          else:
              files += ['frontend/src/features/execution/exec.ts', 'frontend/src/features/execution/exec.test.ts']
          for path in files:
              original = subprocess.check_output(['git', 'show', os.environ['ORIGINAL'] + ':' + path])
              with open(path, 'rb') as handle:
                  assert handle.read() == original, path
              print('Preserved original blob:', path)
          PY
      - name: Install and run the full frontend suite on the hosted runner
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
      - name: Rebuild generated output and verify its reproducibility
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend
          git add --all -- openai4s/server/webui/dist
          npm run build --prefix frontend
          git diff --exit-code -- openai4s/server/webui/dist
          python3 scripts/check_directory_readmes.py
          git diff --cached --check
          git commit -m "Merge upstream main and rebuild workbench for PR #$PR"
          test "$(git show -s --format=%P)" = "$ORIGINAL $UPSTREAM"
          python3 - <<'PY'
          import os, subprocess
          original, upstream = os.environ['ORIGINAL'], os.environ['UPSTREAM']
          base = subprocess.check_output(['git', 'merge-base', original, upstream]).decode().strip()
          def files(a, b):
              return set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', a, b]).decode().split('\0')))
          allowed = files(base, original)
          changed = files(upstream, 'HEAD')
          assert all(p in allowed or p.startswith('openai4s/server/webui/dist/') for p in changed), changed - allowed
          print('Final contribution paths:', sorted(changed))
          PY
          git diff --stat "$UPSTREAM" HEAD
      - name: Publish a separate result branch for review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result_branch="chore/closeout-20261021-pr$PR-result"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:refs/heads/$result_branch"
          result="$(git rev-parse HEAD)"
          echo "RESULT_PR_${PR}=$result"
          echo "PR #$PR prepared as [$result](https://github.com/dvd233/OpenAI4S/commit/$result) on $result_branch. Original PR branch has not been updated." >> "$GITHUB_STEP_SUMMARY"
