name: OpenAI4S cloud closeout preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare PR ${{ matrix.pr }} in the cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pr: 215
            original: 02ead366396d5c39cca1447fb811570f2c1136e7
          - pr: 216
            original: 819289264cf729340ce67f18f3f21e8d4ea1022f
    env:
      UPSTREAM: e9f1c284ef5d73454b060847c67ec2f49015ac50
      ORIGINAL: ${{ matrix.original }}
      PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.original }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Merge the pinned upstream; stop on any source conflict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          git config user.name dvd233
          git config user.email 111864431+dvd233@users.noreply.github.com
          git fetch --no-tags https://github.com/PKU-YuanGroup/OpenAI4S.git "$UPSTREAM"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM"
          git merge --no-ff --no-commit "$UPSTREAM" || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U', '-z']).decode().split('\0')
          paths = [p for p in paths if p]
          print('Actual conflicts:', paths)
          assert all(p.startswith('openai4s/server/webui/dist/') for p in paths), paths
          PY
          # Generated output is replaced only by the official build below.
          git reset HEAD -- openai4s/server/webui/dist
          git restore --source=HEAD --worktree -- openai4s/server/webui/dist
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Verify the original source and regression cases are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          files = ['docs/plan-crosswalk.json', 'tests/browser_smoke.mjs']
          if os.environ['PR'] == '215':
              files += ['frontend/src/features/sessions/compute.ts', 'frontend/src/features/sessions/compute.test.ts', 'frontend/src/stores/timeline.ts']
          else:
              files += ['frontend/src/features/execution/exec.ts', 'frontend/src/features/execution/exec.test.ts']
          for path in files:
              original = subprocess.check_output(['git', 'show', os.environ['ORIGINAL'] + ':' + path])
              with open(path, 'rb') as handle:
                  assert handle.read() == original, path
              print('Preserved original blob:', path)
          PY
      - name: Install and run the full frontend suite on the hosted runner
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
      - name: Rebuild generated output and verify its reproducibility
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend
          git add --all -- openai4s/server/webui/dist
          npm run build --prefix frontend
          git diff --exit-code -- openai4s/server/webui/dist
          python3 scripts/check_directory_readmes.py
          # Review the contribution against its new base. Upstream imported
          # CSV artifacts retain CRLF and are not this PR's whitespace edits.
          git diff --cached --check "$UPSTREAM"
          git commit -m "Merge upstream main and rebuild workbench for PR #$PR"
          test "$(git show -s --format=%P)" = "$ORIGINAL $UPSTREAM"
          python3 - <<'PY'
          import os, subprocess
          original, upstream = os.environ['ORIGINAL'], os.environ['UPSTREAM']
          base = subprocess.check_output(['git', 'merge-base', original, upstream]).decode().strip()
          def files(a, b):
              return set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', a, b]).decode().split('\0')))
          allowed = files(base, original)
          changed = files(upstream, 'HEAD')
          assert all(p in allowed or p.startswith('openai4s/server/webui/dist/') for p in changed), changed - allowed
          print('Final contribution paths:', sorted(changed))
          PY
          git diff --stat "$UPSTREAM" HEAD
      - name: Publish verified Git objects without changing any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          def post(resource, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/dvd233/OpenAI4S/git/' + resource,
                  data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'OpenAI4S-existing-PR-closeout',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          upstream = os.environ['UPSTREAM']
          entries = []
          paths = git('diff', '--name-only', '--no-renames', '-z', upstream, 'HEAD').decode().split('\0')
          for path in filter(None, paths):
              assert not path.startswith('.github/'), path
              record = git('ls-tree', 'HEAD', '--', path).decode().strip()
              if not record:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, kind, remainder = record.split(' ', 2)
              oid = remainder.split('\t', 1)[0]
              assert kind == 'blob' and mode == '100644', record
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(git('cat-file', 'blob', oid)).decode()})
              assert blob['sha'] == oid, path
              entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': oid})
          tree = post('trees', {'base_tree': git('rev-parse', upstream + '^{tree}').decode().strip(), 'tree': entries})
          expected_tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
          assert tree['sha'] == expected_tree, (tree['sha'], expected_tree)
          def identity(prefix):
              name, email, date = git('show', '-s', '--format=%' + prefix + 'n%n%' + prefix + 'e%n%' + prefix + 'I').decode().strip().split('\n')
              return {'name': name, 'email': email, 'date': date}
          commit = post('commits', {
              'message': git('show', '-s', '--format=%B').decode().rstrip('\n'),
              'tree': expected_tree, 'parents': [os.environ['ORIGINAL'], upstream],
              'author': identity('a'), 'committer': identity('c')})
          assert commit['tree']['sha'] == expected_tree
          assert [parent['sha'] for parent in commit['parents']] == [os.environ['ORIGINAL'], upstream]
          receipt = {'pr': int(os.environ['PR']), 'sha': commit['sha'], 'tree': expected_tree,
                     'parents': [parent['sha'] for parent in commit['parents']],
                     'paths': [entry['path'] for entry in entries], 'branchesUpdated': False}
          print('VERIFIED_RESULT=' + json.dumps(receipt, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified Git object receipt: ' + json.dumps(receipt, sort_keys=True) + '\n')
          PY
