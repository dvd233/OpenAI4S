# Fork-only verification of a fixed contribution source.
# Jobs check out SOURCE_SHA, not this workflow branch. No publication or
# repository secrets are used. Upstream PR CI remains required before merge.
name: Dataset input acceptance

on:
  push:
    branches: [test/native-dataset-validation]

permissions:
  contents: read

env:
  SOURCE_SHA: ceb8d401fe894f2981ff8dd22770a4045aadf62b

jobs:
  dataset:
    if: github.repository == 'dvd233/OpenAI4S' && github.ref == 'refs/heads/test/native-dataset-validation'
    name: Dataset input (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout fixed contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dev and science dependencies
        run: uv sync --locked --extra science
      - name: Run real native dataset input and analysis contracts
        run: uv run pytest tests/test_dataset_import.py tests/test_store.py tests/test_provenance_paths.py tests/test_artifact_scope_closure.py tests/test_kernel.py tests/test_agent.py tests/test_gateway.py -v --junitxml=dataset-input.xml
      - name: Confirm all six new workflow cases actually executed
        if: success() || failure()
        run: |
          uv run python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("dataset-input.xml").getroot()
          prefixes = (
              "test_native_input_analysis_keeps_its_exact_lineage_after_store_reopen",
              "test_refused_reimport_leaves_the_prior_input_available_for_exact_analysis",
          )
          cases = [case for case in root.iter("testcase")
                   if case.attrib["name"].startswith(prefixes)]
          assert len(cases) == 6, "expected the six joined workflow cases"
          assert all(not any(case.find(kind) is not None
                             for kind in ("skipped", "failure", "error"))
                     for case in cases), "a joined workflow case did not pass"
          print("All six new workflow cases executed successfully")
          PY

  offline:
    if: github.repository == 'dvd233/OpenAI4S' && github.ref == 'refs/heads/test/native-dataset-validation'
    name: Full offline suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fixed contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Install locked dev, science and chemistry dependencies
        run: uv sync --locked --extra science --extra chemistry
      - name: Run complete offline suite
        run: uv run pytest -n auto --maxprocesses=4 --dist loadfile

  static:
    if: github.repository == 'dvd233/OpenAI4S' && github.ref == 'refs/heads/test/native-dataset-validation'
    name: Full pre-commit, types, documentation and source scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fixed contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Install locked dev dependencies
        run: uv sync --locked
      - name: Run full pre-commit
        run: uv run pre-commit run --all-files
      - name: Verify core types
        if: success() || failure()
        run: uv run mypy
      - name: Verify bilingual directory documentation
        if: success() || failure()
        run: uv run python scripts/check_directory_readmes.py
      - name: Scan tracked sources for credentials
        if: success() || failure()
        run: uv run python scripts/source_secret_scan.py

  contracts:
    if: github.repository == 'dvd233/OpenAI4S' && github.ref == 'refs/heads/test/native-dataset-validation'
    name: Frozen response shapes, route contracts and offline PR harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fixed contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Install locked dev, science and chemistry dependencies
        run: uv sync --locked --extra science --extra chemistry
      - name: Check frozen response shapes against real offline responses
        run: uv run python scripts/capture_response_schemas.py --check
      - name: Check route contract coverage
        if: success() || failure()
        run: uv run python scripts/capture_response_contract.py --check
      - name: Run deterministic offline PR harness
        if: success() || failure()
        run: uv run python -m harness.cli run --tier pr --offline
